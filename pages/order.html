<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmetic Shop - Order Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff5f7;
      color: #4a2c35;
    }

    .header {
      background: #c85a78;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 28px;
    }

    .header a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .order-box {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(200, 90, 120, 0.15);
    }

    .order-box h2 {
      color: #c85a78;
      margin-bottom: 25px;
      text-align: center;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      margin-bottom: 8px;
      font-weight: bold;
      color: #6b3c4a;
    }

    input,
    select,
    textarea {
      padding: 13px;
      border: 1px solid #e4a7b8;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background: #fffafb;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #c85a78;
      box-shadow: 0 0 5px rgba(200, 90, 120, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .order-summary {
      margin-top: 30px;
      padding: 20px;
      background: #fff0f4;
      border-radius: 10px;
    }

    .order-summary h3 {
      color: #c85a78;
      margin-bottom: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }

    .total {
      border-top: 1px solid #e4a7b8;
      margin-top: 10px;
      padding-top: 15px;
      font-size: 20px;
      font-weight: bold;
      color: #c85a78;
    }

    .btn {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #c85a78;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #a94361;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      background: #c85a78;
      color: white;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .header {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>Glow Beauty</h1>

    <nav>
            <a href="index.html">Home</a>
            <a href="./pages/product.html">Products</a>
            <a href="./pages/about.html">About</a>
            <a href="./pages/contact.html">Contact</a>
            <a href="./pages/login.html">login</a>
        </nav>
  </header>

  <div class="container">

    <div class="order-box">

      <h2>Place Your Order</h2>

      <form>

        <div class="form-grid">

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>
          </div>

          <div class="form-group">
            <label>Product</label>
            <select required>
              <option value="">Select Product</option>
              <option>Lipstick</option>
              <option>Foundation</option>
              <option>Face Cream</option>
              <option>Mascara</option>
              <option>Perfume</option>
            </select>
          </div>

          <div class="form-group">
            <label>Quantity</label>
            <input type="number" min="1" value="1" required>
          </div>

          <div class="form-group">
            <label>Payment Method</label>
            <select required>
              <option value="">Select Payment</option>
              <option>Cash on Delivery</option>
              <option>UPI</option>
              <option>Credit / Debit Card</option>
            </select>
          </div>

          <div class="form-group full">
            <label>Delivery Address</label>
            <textarea placeholder="Enter your complete delivery address"
              required></textarea>
          </div>

        </div>

        <div class="order-summary">
          <h3>Order Summary</h3>

          <div class="summary-row">
            <span>Product</span>
            <span>₹599</span>
          </div>

          <div class="summary-row">
            <span>Delivery</span>
            <span>₹50</span>
          </div>

          <div class="summary-row total">
            <span>Total</span>
            <span>₹649</span>
          </div>
        </div>

        <button type="submit" class="btn">
          Place Order
        </button>

      </form>

    </div>

  </div>

  <footer class="footer">
    developed By Sakshi Limbhore
  </footer>

</body>
</html>
